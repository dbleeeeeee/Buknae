<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이야기 우체통 관리 · 북내면, 마을마다 이야기</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--paper:#FFFAF4;--paper-2:#F2F1E4;--green:#31532A;--lime:#46CE41;--coral:#E8836B;--ink:#1D211C;--ink-2:#4E544B;--ink-3:#8B9187;--line:rgba(29,33,28,.13);
--hand:'Gaegu','Noto Serif KR',serif;--serif:'Noto Serif KR',serif;--sans:'Pretendard Variable',Pretendard,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;word-break:keep-all}
.wrap{max-width:960px;margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line);background:rgba(255,250,244,.94);position:sticky;top:0;z-index:5}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:14px}
h1{font-family:var(--hand);font-weight:700;font-size:22px;color:var(--green)}
h1 small{font-family:var(--sans);font-size:12px;color:var(--ink-3);margin-left:8px;letter-spacing:.04em}
main{padding:34px 0 80px}
.box{background:#FFFDF9;border:1px solid var(--line);border-top:3px solid var(--coral);padding:22px;margin-bottom:22px}
label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px}
input[type=password],input[type=text]{width:100%;padding:11px 13px;border:1px solid var(--line);background:var(--paper);font:inherit}
.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 18px;border:0;border-radius:2px;background:var(--green);color:#fff;font:inherit;font-weight:500;cursor:pointer}
.btn.line{background:none;color:var(--green);border:1px solid var(--green)}
.btn.del{background:#B3392B}
.btn.sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px}
.msg{font-size:13.5px;margin-top:12px}
.msg.err{color:#B3392B}.msg.ok{color:var(--green)}
.stat{display:flex;gap:26px;flex-wrap:wrap;margin-bottom:18px;font-size:13.5px;color:var(--ink-2)}
.stat b{font-family:var(--hand);font-size:26px;color:var(--coral);display:block;line-height:1.1}
table{width:100%;border-collapse:collapse;font-size:14px;background:#FFFDF9}
th,td{border-bottom:1px solid var(--line);padding:12px 10px;text-align:left;vertical-align:top}
th{font-size:12.5px;color:var(--ink-3);font-weight:500;background:var(--paper-2)}
td.vil{font-family:var(--hand);font-size:17px;color:var(--coral);white-space:nowrap}
td.place{font-family:var(--serif);font-weight:600;white-space:nowrap}
td.story{font-family:var(--serif);color:var(--ink-2);line-height:1.7}
td.meta{font-size:12.5px;color:var(--ink-3);white-space:nowrap}
td.act{white-space:nowrap}
tr.gone{opacity:.35;text-decoration:line-through}
.empty{padding:40px;text-align:center;color:var(--ink-3);border:1px dashed var(--line)}
.hint{font-size:13px;color:var(--ink-2);line-height:1.8;background:var(--paper-2);border:1px solid var(--line);padding:16px 18px;margin-top:22px}
.hint b{color:var(--green)}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#fff;border:1px solid var(--line);padding:1px 5px}
@media(max-width:700px){td.story{min-width:200px}table{font-size:13px}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1>이야기 우체통 관리<small>북내면, 마을마다 이야기</small></h1>
  <a class="btn line sm" href="/">사이트로</a>
</div></header>

<main class="wrap">
  <div class="box" id="loginBox">
    <label for="tok">관리자 비밀번호 (Vercel 환경변수 <code>ADMIN_TOKEN</code> 값)</label>
    <input type="password" id="tok" placeholder="비밀번호" autocomplete="current-password">
    <div class="row"><button class="btn" onclick="login()">들어가기</button>
      <label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="remember" checked style="width:auto"> 이 브라우저에 기억</label></div>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel" style="display:none">
    <div class="stat">
      <div><b id="cTotal">0</b>도착한 이야기</div>
      <div><b id="cVil">0</b>마을</div>
      <div><b id="cStore">-</b>저장소</div>
    </div>
    <div class="row" style="margin:0 0 14px">
      <input type="text" id="q" placeholder="마을·이름·내용으로 찾기" style="max-width:280px" oninput="render()">
      <button class="btn line sm" onclick="load()">새로 고치기</button>
      <button class="btn line sm" onclick="logout()">나가기</button>
    </div>
    <div id="list"></div>
    <div class="hint">
      <b>삭제는 되돌릴 수 없습니다.</b> 지운 이야기는 사이트의 우체통 벽·마을 화면·표지의 점에서 함께 사라집니다.<br>
      연락처는 이 화면에서만 보입니다. 사이트에는 공개되지 않습니다.<br>
      비밀번호를 바꾸려면 Vercel → Settings → Environment Variables 에서 <code>ADMIN_TOKEN</code> 을 수정하고 Redeploy 하세요.
    </div>
  </div>
</main>

<script>
const $=s=>document.querySelector(s);
let TOKEN=sessionStorage.getItem('bk_admin')||localStorage.getItem('bk_admin')||'';
let DATA=[];
function login(){
  const t=$('#tok').value.trim();
  if(!t){msg('비밀번호를 입력해 주세요.','err');return}
  TOKEN=t;
  ($('#remember').checked?localStorage:sessionStorage).setItem('bk_admin',t);
  load();
}
function logout(){TOKEN='';localStorage.removeItem('bk_admin');sessionStorage.removeItem('bk_admin');
  $('#panel').style.display='none';$('#loginBox').style.display='';$('#tok').value='';msg('','')}
function msg(t,k){const el=$('#loginMsg');el.textContent=t;el.className='msg '+(k||'')}
async function load(){
  try{
    const r=await fetch('/api/letters?n=500&full=1',{headers:{'x-admin-token':TOKEN}});
    if(r.status===401){msg('비밀번호가 맞지 않습니다. Vercel의 ADMIN_TOKEN 값을 확인해 주세요.','err');return}
    if(!r.ok) throw new Error('불러오지 못했습니다');
    const d=await r.json();
    DATA=d.letters||[];
    $('#loginBox').style.display='none';$('#panel').style.display='';
    $('#cTotal').textContent=d.total??DATA.length;
    $('#cVil').textContent=new Set(DATA.map(l=>l.village)).size;
    $('#cStore').textContent=d.persistent?'연결됨':'임시';
    render();
  }catch(e){msg('서버에 연결하지 못했습니다. 배포된 주소에서 열어 주세요.','err')}
}
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>{const d=new Date(t);return isNaN(d)?'':`${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`};
function render(){
  const q=$('#q').value.trim();
  const rows=q?DATA.filter(l=>(l.village+l.place+l.story+(l.from||'')).includes(q)):DATA;
  $('#list').innerHTML=rows.length?`<table><thead><tr>
      <th>마을</th><th>이름·자리</th><th>이야기</th><th>보낸 이 · 연락처</th><th>날짜</th><th></th></tr></thead><tbody>
    ${rows.map(l=>`<tr id="r-${esc(l.id)}">
      <td class="vil">${esc(l.village)}</td>
      <td class="place">${esc(l.place)}</td>
      <td class="story">${esc(l.story)}</td>
      <td class="meta">${esc(l.from||'익명')}${l.contact?'<br>'+esc(l.contact):''}</td>
      <td class="meta">${fmt(l.at)}</td>
      <td class="act"><button class="btn del sm" onclick="del('${esc(l.id)}')">삭제</button></td>
    </tr>`).join('')}</tbody></table>`
  :'<div class="empty">도착한 이야기가 없습니다.</div>';
}
async function del(id){
  const l=DATA.find(x=>x.id===id);
  if(!confirm(`이 이야기를 삭제할까요?\n\n[${l?l.village:''}] ${l?l.place:''}\n${l?l.story.slice(0,60):''}…\n\n되돌릴 수 없습니다.`))return;
  try{
    const r=await fetch('/api/letters?id='+encodeURIComponent(id),{method:'DELETE',headers:{'x-admin-token':TOKEN}});
    if(r.status===401){alert('비밀번호가 맞지 않습니다.');return}
    if(!r.ok&&r.status!==404) throw new Error();
    const tr=document.getElementById('r-'+id); if(tr)tr.classList.add('gone');
    DATA=DATA.filter(x=>x.id!==id);
    $('#cTotal').textContent=DATA.length;
    setTimeout(render,400);
  }catch(e){alert('삭제하지 못했습니다. 잠시 후 다시 시도해 주세요.')}
}
if(TOKEN){$('#tok').value=TOKEN;load()}
</script>
</body>
</html>
